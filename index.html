<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講師の事例共有</title>
<style>
:root {
  --bg: #F7F5F0;
  --ink: #1F2A36;
  --btn: #2F5D7C;
  --err: #A12B2B;
  --line: rgba(31,42,54,.2);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
  font-size: 16px;
  line-height: 1.7;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
.trial { font-size: 14px; margin: 0 0 16px; overflow-wrap: anywhere; }
h1 {
  font-size: 24px; font-weight: 700; line-height: 1.5;
  margin: 0 0 16px; overflow-wrap: anywhere;
}
.btn {
  display: block; width: 100%; height: 48px;
  border: 1px solid var(--btn); border-radius: 8px;
  background: var(--btn); color: #fff;
  font-family: inherit; font-size: 18px; font-weight: 700;
  cursor: pointer; padding: 0 16px;
}
.btn.outline, .btn:disabled { background: #fff; color: var(--btn); }
.btn:disabled { cursor: not-allowed; }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.status { min-height: 1.7em; margin: 16px 0 0; overflow-wrap: anywhere; }
.status.err { color: var(--err); }
.notice { margin: 16px 0 0; overflow-wrap: anywhere; }
.card {
  border: 1px solid var(--line); border-radius: 8px;
  padding: 16px; margin: 16px 0 0;
}
.meta { font-size: 14px; margin: 0 0 8px; overflow-wrap: anywhere; }
.badge {
  display: inline-block; font-size: 14px; line-height: 1.4;
  padding: 0 6px; margin-left: 8px;
  border: 1px solid var(--ink); border-radius: 4px;
}
.badge.pending { border-style: dotted; }
.sub { display: block; font-size: 18px; font-weight: 700; margin: 0 0 8px; }
h3.sub { margin-top: 0; }
.body {
  margin: 0 0 16px; white-space: pre-wrap; overflow-wrap: anywhere;
}
.card > .body:last-child { margin-bottom: 0; }
.lead { margin: 0 0 16px; overflow-wrap: anywhere; }
.caution {
  margin: 0 0 24px; padding-left: 12px;
  border-left: 2px solid var(--ink); overflow-wrap: anywhere;
}
.field { margin: 0 0 24px; }
textarea {
  display: block; width: 100%; margin: 0;
  font-family: inherit; font-size: 16px; line-height: 1.7;
  color: var(--ink); background: transparent;
  border: 1px solid var(--ink); border-radius: 8px;
  padding: 12px; resize: vertical;
}
.count { font-size: 14px; text-align: right; margin: 8px 0 0; }
#sendBtn { margin-top: 0; }
#backBtn { margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="trial" id="trialBanner" hidden>お試しモード：この端末の中だけに保存されます</p>

  <section id="listScreen">
    <h1>レポートのAI利用で迷った時の対応を、匿名で共有する場です。書くのは5分ほどです。</h1>
    <button type="button" class="btn" id="goWrite">書き込む</button>
    <p class="status" id="listStatus" role="status"></p>
    <p class="notice" id="notice" role="status" hidden></p>
    <div id="list"></div>
  </section>

  <section id="writeScreen" hidden>
    <p class="lead">ログインもメールも要りません。名前は書かれません。</p>
    <p class="caution">授業名・学生の名前・分野がわかることは書かない</p>

    <div class="field">
      <label class="sub" for="problemText">困ったこと</label>
      <textarea id="problemText" rows="6" maxlength="500"></textarea>
      <p class="count" id="problemCount"></p>
    </div>

    <div class="field">
      <label class="sub" for="responseText">どう対応したか</label>
      <textarea id="responseText" rows="6" maxlength="500"></textarea>
      <p class="count" id="responseCount"></p>
    </div>

    <p class="count">両方の欄に書くと、送信できます。</p>
    <button type="button" class="btn" id="sendBtn" disabled>送信する</button>
    <p class="status" id="writeStatus" role="status"></p>
    <button type="button" class="btn outline" id="backBtn">一覧にもどる</button>
  </section>
</div>

<script>
// ===== 設定（本番は4つとも入れる。空なら「お試しモード」） =====
const CONFIG = {
  FORM_ACTION: 'https://docs.google.com/forms/d/e/1FAIpQLSf093XsxOHZuIGLKJ4hmdZ1rpszMul9xlaNpNRPewuH2IumsQ/formResponse',
  ENTRY_PROBLEM: 'entry.890184969',    // 困ったこと
  ENTRY_RESPONSE: 'entry.1871808409',  // どう対応したか
  SHEET_ID: '1Tr2OIFuY-L_0uwoN90YONd5nrzdqwEDDkbm2KRXhvrI'  // スプレッドシートのID
};

// 見本（この順で、一覧の一番最後に出す）
const SAMPLES = [
  {
    problem: '文章が急に整いすぎていた。検知の結果は決め手にならず、減点してよいか判断できなかった。',
    response: '締め切り後の面談で、一節の内容を口頭で説明してもらった。自分の言葉で答えられたので、そのまま評価した。'
  },
  {
    problem: '最終版だけでは、どう書き進めたかが見えない。AIを使ったかどうか判断できなかった。',
    response: '次の学期から、テーマ、構成案、初稿の3回に分けて提出させ、各回に一言返した。途中の過程が残り、判断の材料になった。'
  },
  {
    problem: '疑いが残るレポートを、減点すべきか迷っている。検知の結果は参考程度と考えている。',
    response: '今学期は疑いだけでは減点せず、評価を保留にしている。「使ったなら、どこをどう使ったか書いてください」と学生に伝えた。結論はまだ出ていない。'
  }
];

const KEY_LOCAL = 'jirei_local_entries_v1';   // お試しモードの書き込み
const KEY_PENDING = 'jirei_pending_v1';       // 本番モードの反映待ち
const MAX_LEN = 500;
const TIMEOUT_MS = 15000;      // 書き込みの待ち時間
const READ_TIMEOUT_MS = 10000; // 一覧の読み込みの待ち時間

const TRIAL = !(CONFIG.FORM_ACTION && CONFIG.ENTRY_PROBLEM && CONFIG.ENTRY_RESPONSE && CONFIG.SHEET_ID);

let sheetEntries = [];   // 最後に読めたシートの書き込み（新しい順）
let loadToken = 0;       // 古い読み込みの結果を捨てるための番号
let sending = false;

const $ = id => document.getElementById(id);

// ===== 小さな道具 =====
function norm(s) {
  return String(s == null ? '' : s).replace(/\r\n?/g, '\n').trim();
}
function keyOf(problem, response) {
  return norm(problem) + '\u0001' + norm(response);
}
function pad(n) { return String(n).padStart(2, '0'); }
function fmtDate(d) {
  return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) +
         ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function fmtIso(iso) {
  const d = new Date(iso);
  return isNaN(d.getTime()) ? String(iso || '') : fmtDate(d);
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

// ===== localStorage（全部 try/catch） =====
function storeGet(key) {
  try {
    const v = JSON.parse(localStorage.getItem(key) || '[]');
    return Array.isArray(v) ? v.filter(x => x && typeof x.problem === 'string' && typeof x.response === 'string') : [];
  } catch (e) {
    return [];
  }
}
function storeSet(key, arr) {
  localStorage.setItem(key, JSON.stringify(arr)); // 呼び出し側で try/catch する
}
function loadLocal() { return storeGet(KEY_LOCAL); }
function loadPending() { return storeGet(KEY_PENDING); }

// ===== 一覧の読み取り（JSONP：scriptタグで読む。file:// でも動く） =====
function cellText(c) {
  if (!c) return '';
  const v = (c.f != null && c.f !== '') ? c.f : c.v;
  return v == null ? '' : String(v);
}

// Google の応答（gviz の JSON）を書き込みの配列にする（新しい順）
function parseSheetJson(res) {
  if (!res || res.status !== 'ok' || !res.table) throw new Error('シートの応答が正しくない');
  const labels = (res.table.cols || []).map(c => norm(c && c.label));
  let pi = labels.indexOf('困ったこと');
  let ri = labels.indexOf('どう対応したか');
  if (pi < 0) pi = 1;
  if (ri < 0) ri = 2;
  const out = [];
  (res.table.rows || []).forEach(row => {
    const c = (row && row.c) || [];
    const problem = norm(cellText(c[pi]));
    const response = norm(cellText(c[ri]));
    if (!problem && !response) return;
    out.push({ ts: norm(cellText(c[0])), problem: problem, response: response });
  });
  return out.reverse();
}

function fetchSheetJsonp() {
  return new Promise((resolve, reject) => {
    const cbName = '__jireiCb' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const script = document.createElement('script');
    let done = false;
    let timer = null;
    const cleanup = () => {
      done = true;
      clearTimeout(timer);
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      script.remove();
    };
    timer = setTimeout(() => {
      if (done) return;
      cleanup();
      reject(new Error('timeout'));
    }, READ_TIMEOUT_MS);
    window[cbName] = (res) => {
      if (done) return;
      cleanup();
      resolve(res);
    };
    script.onerror = () => {
      if (done) return;
      cleanup();
      reject(new Error('script error'));
    };
    script.src = 'https://docs.google.com/spreadsheets/d/' + CONFIG.SHEET_ID +
      '/gviz/tq?tqx=out:json;responseHandler:' + cbName + '&headers=1&_=' + Date.now();
    document.body.appendChild(script);
  });
}

async function postToForm(problem, response) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const body = new URLSearchParams({
      [CONFIG.ENTRY_PROBLEM]: problem,
      [CONFIG.ENTRY_RESPONSE]: response
    });
    await fetch(CONFIG.FORM_ACTION, { method: 'POST', mode: 'no-cors', body: body, signal: ctrl.signal });
  } finally {
    clearTimeout(timer);
  }
}

// 反映待ちのうち、シートに同じ2つの文の行が見つかった分を消す
function reconcilePending(entries) {
  const counts = new Map();
  entries.forEach(e => {
    const k = keyOf(e.problem, e.response);
    counts.set(k, (counts.get(k) || 0) + 1);
  });
  const pend = loadPending();
  const kept = pend.filter(p => {
    const k = keyOf(p.problem, p.response);
    const c = counts.get(k) || 0;
    if (c > 0) { counts.set(k, c - 1); return false; }
    return true;
  });
  if (kept.length !== pend.length) {
    try { storeSet(KEY_PENDING, kept); } catch (e) { /* 消せなくても画面は動く */ }
  }
}

// ===== 一覧 =====
function makeCard(metaText, badgeText, badgeCls, problem, response) {
  const card = el('article', 'card');
  if (metaText || badgeText) {
    const m = el('p', 'meta');
    if (metaText) m.appendChild(document.createTextNode(metaText));
    if (badgeText) m.appendChild(el('span', 'badge ' + badgeCls, badgeText));
    card.appendChild(m);
  }
  card.appendChild(el('h3', 'sub', '困ったこと'));
  card.appendChild(el('p', 'body', problem));
  card.appendChild(el('h3', 'sub', 'どう対応したか'));
  card.appendChild(el('p', 'body', response));
  return card;
}

function render() {
  const list = $('list');
  list.textContent = '';
  if (!TRIAL) {
    loadPending().slice().reverse().forEach(p => {
      list.appendChild(makeCard(fmtIso(p.ts), '反映待ち', 'pending', p.problem, p.response));
    });
    sheetEntries.forEach(e => {
      list.appendChild(makeCard(e.ts, '', '', e.problem, e.response));
    });
  } else {
    loadLocal().slice().reverse().forEach(e => {
      list.appendChild(makeCard(fmtIso(e.ts), '', '', e.problem, e.response));
    });
  }
  SAMPLES.forEach(s => {
    list.appendChild(makeCard('', '見本', 'sample', s.problem, s.response));
  });
}

function setListStatus(text, isErr) {
  const s = $('listStatus');
  s.textContent = text;
  s.classList.toggle('err', !!isErr);
}

async function loadList() {
  const token = ++loadToken;
  if (TRIAL) {
    setListStatus('');
    render();
    return;
  }
  setListStatus('一覧を読み込んでいます…');
  render();
  try {
    const res = await fetchSheetJsonp();
    const entries = parseSheetJson(res);
    if (token !== loadToken) return;
    sheetEntries = entries;
    reconcilePending(entries);
    setListStatus('');
  } catch (err) {
    if (token !== loadToken) return;
    setListStatus('一覧を読み込めませんでした。時間をおいて開き直してください。', true);
  }
  if (token !== loadToken) return;
  render();
}

// ===== 画面の切り替え =====
function showList() {
  $('writeScreen').hidden = true;
  $('listScreen').hidden = false;
  window.scrollTo(0, 0);
}
function showWrite() {
  $('listScreen').hidden = true;
  $('writeScreen').hidden = false;
  $('writeStatus').textContent = '';
  $('writeStatus').classList.remove('err');
  updateWriteUI();
  window.scrollTo(0, 0);
}
function setNotice(text) {
  const n = $('notice');
  n.textContent = text;
  n.hidden = !text;
}

// ===== 書き込み =====
function setWriteStatus(text, isErr) {
  const s = $('writeStatus');
  s.textContent = text;
  s.classList.toggle('err', !!isErr);
}

function updateWriteUI() {
  const p = $('problemText').value;
  const r = $('responseText').value;
  $('problemCount').textContent = 'あと' + (MAX_LEN - p.length) + '字';
  $('responseCount').textContent = 'あと' + (MAX_LEN - r.length) + '字';
  const btn = $('sendBtn');
  const ok = norm(p) !== '' && norm(r) !== '' && !sending;
  btn.disabled = !ok;
  btn.textContent = sending ? '送信しています…' : '送信する';
}

async function onSend() {
  if (sending) return;
  const problem = norm($('problemText').value);
  const response = norm($('responseText').value);
  if (!problem || !response) return;

  sending = true;
  setWriteStatus('');
  updateWriteUI();

  let ok = false;
  try {
    const now = new Date().toISOString();
    if (TRIAL) {
      const arr = loadLocal();
      arr.push({ ts: now, problem: problem, response: response });
      storeSet(KEY_LOCAL, arr);
    } else {
      await postToForm(problem, response);
      try {
        const pend = loadPending();
        pend.push({ ts: now, problem: problem, response: response });
        storeSet(KEY_PENDING, pend);
      } catch (e) { /* 覚えられなくても送信は済んでいる */ }
    }
    ok = true;
  } catch (err) {
    ok = false;
  }
  sending = false;

  if (ok) {
    $('problemText').value = '';
    $('responseText').value = '';
    updateWriteUI();
    showList();
    setNotice('送信しました。一覧の一番上に出ます（反映まで少し時間がかかることがあります）。');
    loadList();
  } else {
    setWriteStatus('送信できませんでした。入力は残っています。もう一度押してください。', true);
    updateWriteUI();
  }
}

// ===== 起動 =====
$('trialBanner').hidden = !TRIAL;
$('goWrite').addEventListener('click', () => { setNotice(''); showWrite(); });
$('backBtn').addEventListener('click', () => { showList(); loadList(); });
$('problemText').addEventListener('input', updateWriteUI);
$('responseText').addEventListener('input', updateWriteUI);
$('sendBtn').addEventListener('click', onSend);
updateWriteUI();
loadList();
</script>
</body>
</html>
